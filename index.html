<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sprint 3 - Task Manager</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <h1>Task Manager</h1>
    <p>JavaScript • LocalStorage • Unit Testing</p>
  </header>

  <main class="container">
    <section class="card">
      <h2 id="formTitle">Add Task</h2>
      <form id="taskForm" novalidate>
        <input type="hidden" id="taskId">

        <div class="form-grid">
          <div class="field">
            <label for="name">Task Name</label>
            <input type="text" id="name" maxlength="100" placeholder="Enter task name">
            <small class="error" id="nameError"></small>
          </div>

          <div class="field">
            <label for="assignedTo">Assigned To</label>
            <input type="text" id="assignedTo" maxlength="60" placeholder="Enter assignee">
            <small class="error" id="assignedToError"></small>
          </div>

          <div class="field">
            <label for="dueDate">Due Date</label>
            <input type="date" id="dueDate">
            <small class="error" id="dueDateError"></small>
          </div>

          <div class="field">
            <label for="status">Status</label>
            <select id="status">
              <option value="">Select status</option>
              <option value="Pending">Pending</option>
              <option value="In Progress">In Progress</option>
              <option value="Completed">Completed</option>
            </select>
            <small class="error" id="statusError"></small>
          </div>

          <div class="field full">
            <label for="description">Description</label>
            <textarea id="description" rows="4" maxlength="500" placeholder="Enter task description"></textarea>
            <small class="error" id="descriptionError"></small>
          </div>
        </div>

        <div class="actions">
          <button type="submit" id="saveButton">Save</button>
          <button type="button" id="clearButton" class="secondary">Clear</button>
        </div>
      </form>
    </section>

    <section class="card">
      <div class="list-header">
        <div>
          <h2>Task List</h2>
          <p id="taskCount">0 tasks</p>
        </div>
      </div>
      <div id="taskList" class="task-list" aria-live="polite"></div>
      <p id="emptyMessage" class="empty">No tasks available.</p>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
